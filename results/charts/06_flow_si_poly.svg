<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="1140" height="600" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>How the fish waste is used: semi-intensive fish polyculture</title>
<desc>Flows of feed, water and nitrogen through the semi-intensive fish polyculture in one production cycle (INTEGRATE deliverable PI05#3, Tables 4 and 5).</desc>
<style>
.flow{fill:none;stroke-linecap:butt;opacity:.85}
.lab{font-size:12px;fill:#444441}
.t{font-size:15px;font-weight:600}.s{font-size:12px}
</style>
<rect width="1140" height="600" fill="#FFFFFF"/>
<text x="25" y="30" font-size="18" font-weight="600" fill="#2C2C2A">How the fish waste is used: semi-intensive fish polyculture</text>
<text x="25" y="52" font-size="12" fill="#5F5E5A">IPMA research station, Olhao, Portugal · 1,700 m² pond · 26 months · fish only · one production cycle · nitrogen in kg N</text>
<marker id="si-poly-e0-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BA7517"/></marker>
<path id="si-poly-e0" class="flow" d="M215,110.0 C254.5,110.0 254.5,244 294,244" stroke="#BA7517" stroke-width="12.0" marker-end="url(#si-poly-e0-a)"/>
<text class="lab" x="227" y="100" text-anchor="start">738 kg N</text>
<marker id="si-poly-e1-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4537E"/></marker>
<path id="si-poly-e1" class="flow" d="M215,235.0 C254.5,235.0 254.5,258 294,258" stroke="#D4537E" stroke-width="3.0" marker-end="url(#si-poly-e1-a)"/>
<marker id="si-poly-e2-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#378ADD"/></marker>
<path id="si-poly-e2" class="flow" d="M215,360.0 C254.5,360.0 254.5,272 294,272" stroke="#378ADD" stroke-width="3.0" marker-end="url(#si-poly-e2-a)"/>
<marker id="si-poly-e3-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker>
<path id="si-poly-e3" class="flow" d="M215,485.0 C254.5,485.0 254.5,286 294,286" stroke="#7F77DD" stroke-width="2.5" marker-end="url(#si-poly-e3-a)"/>
<marker id="si-poly-e4-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker>
<path id="si-poly-e4" class="flow" d="M490,265.0 L860,265.0" stroke="#534AB7" stroke-width="5.0" marker-end="url(#si-poly-e4-a)"/>
<text class="lab" x="675" y="255" text-anchor="middle">harvest</text>
<marker id="si-poly-e5-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker>
<path id="si-poly-e5" class="flow" d="M395.0,300 C487.5,300 487.5,540.0 580,540.0" stroke="#E24B4A" stroke-width="10.2" marker-end="url(#si-poly-e5-a)"/>
<text class="lab" x="475" y="442" text-anchor="end">589 kg N</text>
<g class="node"><rect x="25" y="75" width="190" height="70" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/><text class="t" x="120.0" y="104" text-anchor="middle" fill="#BA7517">Fish feed</text><text class="s" x="120.0" y="125" text-anchor="middle" fill="#BA7517">10,975 kg · 738 kg N</text></g>
<g class="node"><rect x="25" y="200" width="190" height="70" rx="12" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/><text class="t" x="120.0" y="229" text-anchor="middle" fill="#993556">Fry</text><text class="s" x="120.0" y="250" text-anchor="middle" fill="#993556">91.0 kg stocked</text></g>
<g class="node"><rect x="25" y="325" width="190" height="70" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text class="t" x="120.0" y="354" text-anchor="middle" fill="#185FA5">Seawater</text><text class="s" x="120.0" y="375" text-anchor="middle" fill="#185FA5">1,201,764 m³ · pumped</text></g>
<g class="node"><rect x="25" y="450" width="190" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text class="t" x="120.0" y="479" text-anchor="middle" fill="#534AB7">Energy</text><text class="s" x="120.0" y="500" text-anchor="middle" fill="#534AB7">pumping + aeration</text></g>
<g class="node"><rect x="300" y="230" width="190" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text class="t" x="395.0" y="259" text-anchor="middle" fill="#0F6E56">Fish pond</text><text class="s" x="395.0" y="280" text-anchor="middle" fill="#0F6E56">feed → fish → waste</text></g>
<g class="node"><rect x="580" y="75" width="190" height="70" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 4"/><text class="t" x="675.0" y="104" text-anchor="middle" fill="#B4B2A9">Oysters</text><text class="s" x="675.0" y="125" text-anchor="middle" fill="#B4B2A9">none in this system</text></g>
<g class="node"><rect x="580" y="385" width="190" height="70" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 4"/><text class="t" x="675.0" y="414" text-anchor="middle" fill="#B4B2A9">Macroalgae</text><text class="s" x="675.0" y="435" text-anchor="middle" fill="#B4B2A9">none in this system</text></g>
<g class="node"><rect x="860" y="230" width="190" height="70" rx="12" fill="#EEEDFE" stroke="#3C3489" stroke-width="1.5"/><text class="t" x="955.0" y="259" text-anchor="middle" fill="#3C3489">Fish</text><text class="s" x="955.0" y="280" text-anchor="middle" fill="#3C3489">6,137 kg gained</text></g>
<g class="node"><rect x="860" y="75" width="190" height="70" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 4"/><text class="t" x="955.0" y="104" text-anchor="middle" fill="#B4B2A9">Oyster flesh</text><text class="s" x="955.0" y="125" text-anchor="middle" fill="#B4B2A9">–</text></g>
<g class="node"><rect x="860" y="385" width="190" height="70" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 4"/><text class="t" x="955.0" y="414" text-anchor="middle" fill="#B4B2A9">Macroalgae harvest</text><text class="s" x="955.0" y="435" text-anchor="middle" fill="#B4B2A9">–</text></g>
<g class="node"><rect x="580" y="505" width="190" height="70" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/><text class="t" x="675.0" y="534" text-anchor="middle" fill="#A32D2D">Lagoon / estuary</text><text class="s" x="675.0" y="555" text-anchor="middle" fill="#A32D2D">589 kg N released</text></g>
<text x="860" y="520" font-size="13" font-weight="600" fill="#2C2C2A">N in products: 149 kg</text>
<text x="860" y="540" font-size="12" fill="#5F5E5A">fish 149</text>
<text x="860" y="560" font-size="12" fill="#5F5E5A">N use efficiency 20%</text>
<text x="1115" y="590" text-anchor="end" font-size="11" fill="#888780">Data: INTEGRATE deliverable PI05#3 (IPMA, CTAQUA 2020)</text>
</svg>